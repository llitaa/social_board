campaign_repo: /Users/anton/dev/campaign
content_plan: /Users/anton/dev/campaign/content-plan.csv
posts_log: /Users/anton/dev/campaign/posts-log.csv
inbound_log: /Users/anton/dev/campaign/inbound-log.csv
profile_weekly: /Users/anton/dev/campaign/profile-weekly.csv   # S3: weekly sum of profile visits, typed on the board   # F5: qualified conversations and introductions, one row each, source as the person stated it
post_texts: /Users/anton/dev/campaign/local/reports/out
post_images: /Users/anton/dev/campaign/local/resources/post-images
legacy_photos: /Users/anton/dev/campaign/local/resources/anton-photos
library: ./library
groups: [bni-gilching]     # boards with a common group get each other's shared material proposed (match.py); a board may be in several; no common group = never
board:
  ssh_alias: hostinger-alpitype
  remote_dir: ~/domains/alpitype.de/public_html/board
  url: https://alpitype.de/board/
photo_sources:            # scanned for camera photos with a face; copies go to library/photos, originals stay
  - ~/Downloads
photo_reuse_days: 90      # a used photo is eligible again after this many days
photo_fresh_months: 24    # older photos are picked only when nothing newer is eligible
llm:
  memo_auto: true         # 04.11. (Anton: "my memos never processed"): a waiting voice memo wakes draft.py in the background chain; no memo, no call
  match_auto: true        # 04.11.: the one exception on Anton's board: match.py (shared material of the network under a draft) may call the model in the background; small calls, the demo needs it
  auto: false             # false (Anton, 26.10.): the background chain makes NO model calls; drafts, redrafts, learning and photo tags wait until `python3 pipeline/process.py` is run in a terminal. true = as before, every 10 min
  backend: claude-p       # claude-p = `claude -p` on the subscription; api = Anthropic API (ANTHROPIC_API_KEY)
  claude: ''              # path of the claude CLI when it is not on the worker's PATH (launchd/cron); empty = search the usual places
  models:
    draft: claude-opus-5-5
    redraft: claude-opus-5-5
    inventory: claude-opus-5-5
    tags: claude-haiku-5-5
    comment: claude-sonnet-5-5
    learn: claude-sonnet-5-5    # one call per note/edit/skip reason -> library/style-rules.txt
slots:                    # weekday -> channel and time; the pipeline keeps every slot in the next 14 days filled
  personal: {days: [Mon, Wed, Fri], time: "07:30", lang: de}
  company:  {days: [Thu], time: "09:00", lang: en}
horizon_days: 14
engagement:               # Anton 30.10.: 1-2 posts a week for founders without a tech background and AI-leadership hirers, with a graphic instead of a photo
  days: []                # 01.11.: no automatic graphic posts; Mon/Fri are photo posts again, a diagram only when a topic needs one (import_draft with png); series test continues by hand
  pillars: [transformation, money, learning, trend]
publish:
  where: server           # server = the host posts approved cards at their slot (server/publish.php, hPanel cron + ticks); mac = pipeline/publish.py posts from here
orthography: ch           # personal posts: Swiss standard German, ss instead of ß (target market since 20.10.2026; de = keep ß)
personal_card:
  style: bottom           # off = plain pool photo; bottom = full photo, headline alone at the foot (Anton 20.10.); band | light | overlay = older variants (pipeline/templates/personal-card.html)
  who: none               # bottom line (band/light/overlay only): name | role | none
  rule: true              # short cyan accent line above the headline (bottom/overlay)
cv_pdf: ~/dev/career/cv/Anton_Lytvynenko_CV_EN.pdf
company_context: ~/.claude/alpitype/company-context.md
logo: ~/.claude/templates/alpitype-logo-color-transparent.png
chrome: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
match:
  strict: false   # pilot (04.11.): the text matcher proposes a real bridge instead of waiting for the perfect fit; the person decides with Ja/Nein
