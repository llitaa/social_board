campaign_repo: /Users/anton/dev/campaign
content_plan: /Users/anton/dev/campaign/content-plan.csv
posts_log: /Users/anton/dev/campaign/posts-log.csv
post_texts: /Users/anton/dev/campaign/local/reports/out
post_images: /Users/anton/dev/campaign/local/resources/post-images
legacy_photos: /Users/anton/dev/campaign/local/resources/anton-photos
library: ./library
board:
  ssh_alias: hostinger-alpitype
  remote_dir: ~/domains/alpitype.de/public_html/board
  url: https://alpitype.de/board/
photo_sources:            # scanned for camera photos with a face; copies go to library/photos, originals stay
  - ~/Downloads
photo_reuse_days: 90      # a used photo is eligible again after this many days
photo_fresh_months: 24    # older photos are picked only when nothing newer is eligible
llm:
  backend: claude-p       # claude-p = `claude -p` on the subscription; api = Anthropic API (ANTHROPIC_API_KEY)
  models:
    draft: claude-opus-5-5
    redraft: claude-opus-5-5
    inventory: claude-opus-5-5
    tags: claude-haiku-5-5
    comment: claude-sonnet-5-5
slots:                    # weekday -> channel and time; the pipeline keeps every slot in the next 14 days filled
  personal: {days: [Mon, Wed, Fri], time: "07:30", lang: de}
  company:  {days: [Thu], time: "09:00", lang: en}
horizon_days: 14
cv_pdf: ~/dev/career/cv/Anton_Lytvynenko_CV_EN.pdf
company_context: ~/.claude/alpitype/company-context.md
logo: ~/.claude/templates/alpitype-logo-color-transparent.png
chrome: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
